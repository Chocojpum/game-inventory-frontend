<div class="app-shell min-h-screen">
  <header
    class="sticky top-0 z-[1000] border-b border-border bg-surface/95 px-4 py-4 backdrop-blur-md sm:px-8"
  >
    <div class="mx-auto flex max-w-[1400px] flex-col">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <a
          routerLink="/"
          class="flex items-center gap-2 text-2xl font-bold text-ink no-underline transition-opacity hover:opacity-90"
        >
          <span aria-hidden="true">🐣</span>
          <span>Game Collection Inventory</span>
        </a>
        <div class="flex items-center gap-2">
          <button
            type="button"
            class="btn btn-ghost"
            (click)="toggleNav()"
            [attr.aria-expanded]="!navCollapsed"
            aria-controls="primary-nav"
          >
            <span aria-hidden="true">{{ navCollapsed ? '▾' : '▴' }}</span>
            {{ navCollapsed ? 'Menu' : 'Hide' }}
          </button>
          <button type="button" class="btn btn-ghost" (click)="scrollToTop()">
            <span aria-hidden="true">⬆️</span> Top
          </button>
          <button type="button" class="btn btn-ghost" (click)="exportData()" [disabled]="busy">
            <span aria-hidden="true">📁</span> Export
          </button>
          <label
            class="btn btn-ghost"
            [class.opacity-50]="busy"
            [class.cursor-not-allowed]="busy"
          >
            <span aria-hidden="true">📂</span> Import
            <input
              class="hidden"
              type="file"
              accept=".xlsx"
              [disabled]="busy"
              (change)="importData($event)"
            />
          </label>
        </div>
      </div>

      <div
        class="grid transition-all duration-300 ease-out"
        [ngClass]="navCollapsed ? 'grid-rows-[0fr] mt-0' : 'grid-rows-[1fr] mt-4'"
      >
      <nav
        id="primary-nav"
        class="flex flex-wrap gap-1.5 overflow-hidden min-h-0"
        aria-label="Primary"
      >
        <a
          routerLink="/"
          routerLinkActive="!bg-brand !text-ink !shadow-card"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-full px-4 py-2 text-sm font-semibold text-ink-muted no-underline transition-colors hover:bg-surface-2 hover:text-ink"
          >Games</a
        >
        <a
          routerLink="/addons"
          routerLinkActive="!bg-brand !text-ink !shadow-card"
          class="rounded-full px-4 py-2 text-sm font-semibold text-ink-muted no-underline transition-colors hover:bg-surface-2 hover:text-ink"
          >Addons</a
        >
        <a
          routerLink="/console-families"
          routerLinkActive="!bg-brand !text-ink !shadow-card"
          class="rounded-full px-4 py-2 text-sm font-semibold text-ink-muted no-underline transition-colors hover:bg-surface-2 hover:text-ink"
          >Console Families</a
        >
        <a
          routerLink="/consoles"
          routerLinkActive="!bg-brand !text-ink !shadow-card"
          class="rounded-full px-4 py-2 text-sm font-semibold text-ink-muted no-underline transition-colors hover:bg-surface-2 hover:text-ink"
          >Consoles</a
        >
        <a
          routerLink="/peripherals"
          routerLinkActive="!bg-brand !text-ink !shadow-card"
          class="rounded-full px-4 py-2 text-sm font-semibold text-ink-muted no-underline transition-colors hover:bg-surface-2 hover:text-ink"
          >Peripherals</a
        >
        <a
          routerLink="/categories"
          routerLinkActive="!bg-brand !text-ink !shadow-card"
          class="rounded-full px-4 py-2 text-sm font-semibold text-ink-muted no-underline transition-colors hover:bg-surface-2 hover:text-ink"
          >Categories</a
        >
        <a
          routerLink="/attributes"
          routerLinkActive="!bg-brand !text-ink !shadow-card"
          class="rounded-full px-4 py-2 text-sm font-semibold text-ink-muted no-underline transition-colors hover:bg-surface-2 hover:text-ink"
          >Attributes</a
        >
        <a
          routerLink="/backlog"
          routerLinkActive="!bg-brand !text-ink !shadow-card"
          class="rounded-full px-4 py-2 text-sm font-semibold text-ink-muted no-underline transition-colors hover:bg-surface-2 hover:text-ink"
          >Backlog</a
        >
      </nav>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-[1400px] px-4 py-8 sm:px-8">
    <router-outlet></router-outlet>
  </main>
</div>

<app-toast-container></app-toast-container>
<app-confirm-dialog></app-confirm-dialog>
