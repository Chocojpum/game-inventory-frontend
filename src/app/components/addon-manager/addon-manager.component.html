<div class="addon-overlay" (click)="closeModal()">
  <div class="addon-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ isEditMode ? "✏️ Edit Addon" : "➕ Add Addon" }}</h2>
      <button type="button" class="close-btn" (click)="closeModal()">✕</button>
    </div>

    <form [formGroup]="addonForm" (ngSubmit)="onSubmit()" class="addon-form">
      <div class="form-group">
        <label>Title *</label>
        <input type="text" formControlName="title" placeholder="Enter Addon title" />
      </div>

      <div class="form-group">
        <label>Alternate Titles</label>
        <div formArrayName="alternateTitles">
          <div
            *ngFor="let title of alternateTitles.controls; let i = index"
            class="array-item"
          >
            <input type="text" [formControlName]="i" placeholder="Alternate title" />
            <button type="button" class="remove-btn" (click)="removeAlternateTitle(i)">✕</button>
          </div>
        </div>
        <button type="button" class="add-btn" (click)="addAlternateTitle()">
          + Add Alternate Title
        </button>
      </div>

      <div class="form-group">
        <label>Cover Art URL *</label>
        <input
          type="url"
          formControlName="coverArt"
          placeholder="https://example.com/cover.jpg"
        />
        <div class="cover-preview" *ngIf="addonForm.get('coverArt')?.value">
          <img [src]="addonForm.get('coverArt')?.value" alt="Cover preview" />
        </div>
      </div>

      <div class="form-group">
        <label>Release Date *</label>
        <input title="addon-release-date" type="date" formControlName="releaseDate" />
      </div>

      <div class="custom-attribute-section">
        <h4>Custom Attributes</h4>
        <div class="inline-form">
          <input type="text" [(ngModel)]="newAttributeName" [ngModelOptions]="{ standalone: true }" placeholder="Attribute name" />
          <input type="text" [(ngModel)]="newAttributeValue" [ngModelOptions]="{ standalone: true }" placeholder="Value" />
          <button type="button" (click)="addCustomAttribute()">Add</button>
        </div>
        <div class="current-attributes" *ngIf="customAttributesArray.length > 0">
          <div *ngFor="let attr of customAttributesArray" class="attr-tag">
            <strong>{{ attr.key }}:</strong> {{ attr.value }}
            <button type="button" (click)="removeCustomAttribute(attr.key)">✕</button>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="submit-btn" [disabled]="!addonForm.valid">
          {{ isEditMode ? "Update Addon" : "Add Addon" }}
        </button>
        <button type="button" class="cancel-btn" (click)="closeModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>
