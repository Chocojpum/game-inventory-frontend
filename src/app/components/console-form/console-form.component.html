<div class="mx-auto max-w-2xl card p-6 md:p-8">
  <h2 class="mb-6 text-2xl font-bold text-ink">{{ isEditMode ? "Edit Console" : "Add New Console" }}</h2>

  <div class="mb-6 rounded-lg border border-warning bg-warning/10 px-4 py-3 text-sm text-ink" *ngIf="isFlowTarget">
    🎮 You're creating a console to add to another item. Fill it in and click <strong>Add Console</strong> to return with it selected.
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <h3 class="mb-4 text-lg font-bold text-accent">Basic Information</h3>

    <div class="mb-5">
      <label class="mb-1.5 block font-semibold text-ink">Console Family <span class="text-danger">*</span></label>
      <select title="console-family-input" formControlName="consoleFamilyId" class="w-full px-3 py-2">
        <option value="">Select Console Family</option>
        <option *ngFor="let family of families" [value]="family.id">{{ family.name }} ({{ family.developer }})</option>
      </select>
      <button type="button" class="btn btn-ghost mt-2 !px-3 !py-1.5 text-sm" (click)="startCreate('consoleFamilyId', false, '/console-families')">+ New console family</button>
    </div>

    <div class="mb-5 grid gap-4 sm:grid-cols-2">
      <div>
        <label class="mb-1.5 block font-semibold text-ink">Model <span class="text-danger">*</span></label>
        <input type="text" formControlName="model" placeholder="e.g., Slim, Pro" class="w-full px-3 py-2" />
      </div>
      <div>
        <label class="mb-1.5 block font-semibold text-ink">Release Date <span class="text-danger">*</span></label>
        <input title="release-date-input" type="date" formControlName="releaseDate" class="w-full px-3 py-2" />
      </div>
    </div>

    <div class="mb-5 grid gap-4 sm:grid-cols-2">
      <div>
        <label class="mb-1.5 block font-semibold text-ink">Region <span class="text-danger">*</span></label>
        <input type="text" formControlName="region" placeholder="e.g., NTSC, PAL" class="w-full px-3 py-2" />
      </div>
      <div>
        <label class="mb-1.5 block font-semibold text-ink">Color <span class="text-danger">*</span></label>
        <input type="text" formControlName="color" placeholder="e.g., Black, White" class="w-full px-3 py-2" />
      </div>
    </div>

    <div class="mb-5">
      <label class="mb-1.5 block font-semibold text-ink">Picture URL <span class="text-danger">*</span></label>
      <input type="url" formControlName="picture" placeholder="https://example.com/console.jpg" class="w-full px-3 py-2" />
      <div class="mt-3 max-w-[200px] overflow-hidden rounded-lg border border-border" *ngIf="form.get('picture')?.value">
        <img [src]="form.get('picture')?.value" alt="Image preview" class="block w-full" />
      </div>
    </div>

    <p class="mb-4 text-sm text-ink-subtle"><span class="text-danger">*</span> Required field</p>
    <div class="flex gap-3">
      <button type="submit" class="btn btn-primary flex-1">{{ isEditMode ? "Update Console" : "Add Console" }}</button>
      <button type="button" class="btn btn-ghost" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>
