<div class="mx-auto max-w-[900px]" *ngIf="console">
  <button type="button" class="btn btn-ghost mb-6" (click)="goBack()">← Back</button>

  <div class="card overflow-hidden">
    <div class="grid grid-cols-1 gap-8 p-6 md:grid-cols-[280px_1fr] md:p-8">
      <div class="console-art flex items-center justify-center overflow-hidden rounded-xl border border-border p-4 shadow-card">
        <img [src]="console.picture" [alt]="getConsoleName()" class="max-h-[260px] max-w-full object-contain" />
      </div>

      <div class="min-w-0">
        <h1 class="text-3xl font-bold text-ink">{{ getConsoleName() }}</h1>
        <p class="mt-1 font-semibold text-brand-strong" *ngIf="family">{{ family.developer }}</p>

        <div class="mt-5 grid grid-cols-[repeat(auto-fit,minmax(160px,1fr))] gap-3">
          <div class="rounded-lg border border-border bg-surface-2 px-3 py-2">
            <span class="block text-xs uppercase tracking-wide text-ink-subtle">Model</span>
            <span class="font-semibold text-ink">{{ console.model }}</span>
          </div>
          <div class="rounded-lg border border-border bg-surface-2 px-3 py-2">
            <span class="block text-xs uppercase tracking-wide text-ink-subtle">Release Date</span>
            <span class="font-semibold text-ink">{{ console.releaseDate | date : "yyyy-MM-dd" }}</span>
          </div>
          <div class="rounded-lg border border-border bg-surface-2 px-3 py-2">
            <span class="block text-xs uppercase tracking-wide text-ink-subtle">Region</span>
            <span class="font-semibold text-ink">{{ console.region }}</span>
          </div>
          <div class="rounded-lg border border-border bg-surface-2 px-3 py-2">
            <span class="block text-xs uppercase tracking-wide text-ink-subtle">Color</span>
            <span class="font-semibold text-ink">{{ console.color }}</span>
          </div>
        </div>

        <div class="mt-6 flex flex-wrap gap-3">
          <button type="button" class="btn btn-ghost" (click)="editConsole()">✏️ Edit</button>
          <button type="button" class="btn btn-danger" (click)="deleteConsole()">🗑️ Delete</button>
        </div>
      </div>
    </div>

    <div class="border-t border-border p-6 md:p-8" *ngIf="hasCustomAttributes()">
      <h2 class="mb-4 text-xl font-bold text-ink">Additional Information</h2>
      <div class="grid grid-cols-[repeat(auto-fit,minmax(200px,1fr))] gap-3">
        <div class="rounded-lg border border-border bg-surface-2 px-3 py-2" *ngFor="let attr of getCustomAttributesArray()">
          <span class="block text-xs uppercase tracking-wide text-ink-subtle">{{ attr.key }}</span>
          <span class="font-semibold text-ink">{{ attr.value }}</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="flex items-center justify-center py-20 text-ink-muted" *ngIf="!console">
  <p>Loading...</p>
</div>
